services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 15
  api:
    build: .
    command: ["taskflow-api"]
    environment:
      REDIS_ADDR: redis:6379
      DATA_DIR: /app/data
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "127.0.0.1:${TASKFLOW_HTTP_PORT:-8080}:8080"
    volumes:
      - taskflow_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 12s
    restart: unless-stopped
  worker:
    build: .
    command: ["taskflow-worker"]
    scale: 2
    environment:
      REDIS_ADDR: redis:6379
      DATA_DIR: /app/data
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      WORKER_TIMEOUT: "${WORKER_TIMEOUT:-25s}"
      WORKER_LEASE: "${WORKER_LEASE:-40s}"
      WORKER_MIN_IDLE: "${WORKER_MIN_IDLE:-45s}"
      WORKER_MAX_ATTEMPTS: "${WORKER_MAX_ATTEMPTS:-3}"
    volumes:
      - taskflow_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 12s
    restart: unless-stopped
volumes:
  redis_data:
  taskflow_data:
