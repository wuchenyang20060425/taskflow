name: TaskFlow CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y redis-server poppler-utils
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 ./...
        env:
          TASKFLOW_INTEGRATION: '1'
      - run: go test -race -count=1 ./...
        env:
          TASKFLOW_INTEGRATION: '1'
      - run: docker compose config --quiet
      - run: python3 scripts/failover.py
      - run: bash scripts/compose-smoke.sh
